name: Continuous tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test
            suite: core
          - name: Terminal integration
            suite: terminal
          - name: MCP integration (1/2)
            suite: mcp
            shard: 1/2
          - name: MCP integration (2/2)
            suite: mcp
            shard: 2/2
    steps:
      - uses: actions/checkout@master

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: pnpm-v1-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        if: matrix.suite == 'core'
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Install test Chromium
        timeout-minutes: 10
        run: pnpm --filter histoire exec playwright install --with-deps chromium

      - name: Run tests
        if: matrix.suite == 'core'
        # Vitest already runs test files concurrently within each package.
        run: pnpm run -r --workspace-concurrency 1 --filter './packages/**' test

      - name: Run MCP integration tests
        if: matrix.suite == 'mcp'
        env:
          BROWSER: none
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter histoire test:mcp:integration --shard="$SHARD"

      - name: Run terminal integration tests
        if: matrix.suite == 'terminal'
        env:
          BROWSER: none
        run: pnpm --filter histoire test:terminal

      - name: Run package install tests
        if: matrix.suite == 'core'
        env:
          BROWSER: none
        run: pnpm --filter histoire test:mcp:package
